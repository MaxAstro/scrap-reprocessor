[technology-name]
sr-scrap-reprocessing=废料处理
sr-advanced-reprocessing=高级废料处理

[technology-description]
sr-scrap-reprocessing=解锁[entity=sr-scrap-reprocessor]，一种加压冲洗和分类废料的重型工厂。分类过后的废料可以回收或者输入另一座废料处理厂获得更多产出，同时副产品矿物浆[fluid=sr-mineral-slurry]可以分离成[item=stone]和[fluid=holmium-solution]。废料处理厂还有自带的品质加成。
sr-advanced-reprocessing=解锁在雷神星外的星球使用废料处理厂的各种新方式。大部分配方很复杂，但能充分发挥废料处理厂的高品质加成。

[mod-setting-name]
scrap-reprocessor-quality-setting=处理厂基础品质加成
scrap-reprocessor-architectural-setting=建筑废料产出
scrap-reprocessor-mineral-slurry-setting=矿物浆不会产出铁矿

[mod-setting-description]
scrap-reprocessor-quality-setting=决定废料处理厂自带的品质加成。
scrap-reprocessor-architectural-setting=改变建筑废料的产出。
scrap-reprocessor-mineral-slurry-setting=移除矿物浆的副产物铁矿。这简化了矿物浆处理，但会导致使用废料处理厂无法产出混凝土。

[string-mod-setting]
scrap-reprocessor-quality-setting-none=无加成 [img=info]
scrap-reprocessor-quality-setting-vanilla=类原版加成 (10%) [img=info]
scrap-reprocessor-quality-setting-boosted=进一步加成 (20%) [img=info]
scrap-reprocessor-architectural-setting-default=默认 [img=info]
scrap-reprocessor-architectural-setting-vanilla=类原版 [img=info]
scrap-reprocessor-architectural-setting-hybrid=混合 [img=info]
scrap-reprocessor-architectural-setting-boosted=更多矿物浆 [img=info]

[string-mod-setting-description]
scrap-reprocessor-quality-setting-none=移除废料处理厂的基础品质加成以及对科技 “品质插件 3” 的依赖。你并不想被迫整理各种品质的废料对不对？ 
scrap-reprocessor-quality-setting-vanilla=废料处理厂有 10% 的基础品质加成，与原版的较低的品质数值对应。
scrap-reprocessor-quality-setting-boosted=废料处理厂有 20% 的基础品质加成，与加强品质插件的模组更适配。
scrap-reprocessor-architectural-setting-default=建筑废料回收将产出轻质框架、石砖和铁棒。废料处理配方整体水循环稳定。
scrap-reprocessor-architectural-setting-vanilla=建筑废料处理将产出轻质框架、混凝土和冰 
scrap-reprocessor-architectural-setting-hybrid=建筑废料处理将有默认产出, 但回收会产出接近原版的产物。
scrap-reprocessor-architectural-setting-boosted=建筑废料处理将有默认产出，但会产出额外的矿物浆使水可以实现净增长。